<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88c0d0"/>
      <stop offset="1" stop-color="#5e81ac"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="959" height="559" rx="16" fill="none" stroke="#88c0d0" stroke-opacity="0.2"/>

  <!-- Title -->
  <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#eceff4" letter-spacing="1">Architecture du Service IA</text>
  <text x="480" y="70" text-anchor="middle" font-size="13" fill="#9aa5b8" font-family="monospace">ELPIDA CONSULTING · stage 2026</text>

  <!-- Context (motherboard) -->
  <rect x="30" y="105" width="260" height="415" rx="12" fill="#1d212b" stroke="#88c0d0" stroke-opacity="0.4"/>
  <rect x="30" y="105" width="260" height="40" rx="12" fill="#88c0d0" fill-opacity="0.12"/>
  <text x="160" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#88c0d0">Context (motherboard)</text>
  <text x="160" y="168" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">DI · lifecycle · config.json</text>

  <!-- Components inside context -->
  <g font-size="11.5" fill="#eceff4">
    <rect x="55" y="195" width="210" height="34" rx="8" fill="#2e3440" stroke="#4c566a"/>
    <text x="70" y="217" font-family="monospace">postgres</text>

    <rect x="55" y="245" width="210" height="34" rx="8" fill="#2e3440" stroke="#4c566a"/>
    <text x="70" y="267" font-family="monospace">redis</text>

    <rect x="55" y="295" width="210" height="34" rx="8" fill="#2e3440" stroke="#4c566a"/>
    <text x="70" y="317" font-family="monospace">influxdb</text>

    <rect x="55" y="345" width="210" height="34" rx="8" fill="#2e3440" stroke="#4c566a"/>
    <text x="70" y="367" font-family="monospace">kafka (producer/consumer)</text>

    <rect x="55" y="395" width="210" height="34" rx="8" fill="#2e3440" stroke="#4c566a"/>
    <text x="70" y="417" font-family="monospace">rest_api</text>

    <rect x="55" y="445" width="210" height="34" rx="8" fill="#2e3440" stroke="#4c566a"/>
    <text x="70" y="467" font-family="monospace">llm_chat</text>
  </g>

  <!-- Right column: agents -->
  <g font-size="12" fill="#eceff4">
    <rect x="340" y="105" width="300" height="170" rx="12" fill="#1d212b" stroke="#5e81ac" stroke-opacity="0.5"/>
    <rect x="340" y="105" width="300" height="38" rx="12" fill="#5e81ac" fill-opacity="0.14"/>
    <text x="490" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#81a1c1">AgentSales</text>
    <text x="490" y="155" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">RandomForest · suggestion engine</text>
    <g font-size="11.5" fill="#eceff4">
      <rect x="365" y="170" width="250" height="30" rx="7" fill="#2e3440" stroke="#4c566a"/>
      <text x="380" y="190" font-family="monospace">aggregator (pandas, ~23 features)</text>
      <rect x="365" y="208" width="250" height="30" rx="7" fill="#2e3440" stroke="#4c566a"/>
      <text x="380" y="228" font-family="monospace">trainer (metrics, feature importance)</text>
    </g>

    <rect x="340" y="300" width="300" height="170" rx="12" fill="#1d212b" stroke="#88c0d0" stroke-opacity="0.5"/>
    <rect x="340" y="300" width="300" height="38" rx="12" fill="#88c0d0" fill-opacity="0.12"/>
    <text x="490" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#88c0d0">LLMChat</text>
    <text x="490" y="350" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">DeepSeek · tool-calling</text>
    <g font-size="11.5" fill="#eceff4">
      <rect x="365" y="365" width="250" height="30" rx="7" fill="#2e3440" stroke="#4c566a"/>
      <text x="380" y="385" font-family="monospace">tools: suggestions · orders · cache</text>
      <rect x="365" y="403" width="250" height="30" rx="7" fill="#2e3440" stroke="#4c566a"/>
      <text x="380" y="423" font-family="monospace">history: redis (actif) + postgres</text>
    </g>
  </g>

  <!-- Right edge: events -->
  <rect x="690" y="105" width="240" height="120" rx="12" fill="#1d212b" stroke="#ebcb8b" stroke-opacity="0.5"/>
  <rect x="690" y="105" width="240" height="38" rx="12" fill="#ebcb8b" fill-opacity="0.1"/>
  <text x="810" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#ebcb8b">Événements Kafka</text>
  <text x="810" y="165" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">sales-suggestions</text>
  <text x="810" y="183" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">sales_suggestion_request</text>
  <text x="810" y="201" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">sales_retrain</text>

  <rect x="690" y="255" width="240" height="120" rx="12" fill="#1d212b" stroke="#a3be8c" stroke-opacity="0.5"/>
  <rect x="690" y="255" width="240" height="38" rx="12" fill="#a3be8c" fill-opacity="0.1"/>
  <text x="810" y="279" text-anchor="middle" font-size="14" font-weight="700" fill="#a3be8c">API REST</text>
  <text x="810" y="315" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">GET /suggestions/sales</text>
  <text x="810" y="333" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">POST /chat</text>
  <text x="810" y="351" text-anchor="middle" font-size="11" fill="#9aa5b8" font-family="monospace">API-key header · thread pool</text>

  <!-- Storage bottom -->
  <rect x="340" y="495" width="590" height="32" rx="8" fill="#2e3440" stroke="#4c566a"/>
  <text x="635" y="516" text-anchor="middle" font-size="11.5" fill="#9aa5b8" font-family="monospace">PostgreSQL 17 · Redis 7 · InfluxDB 1.8 · Kafka KRaft · Docker Compose</text>

  <!-- Connector lines -->
  <g stroke="#4c566a" stroke-width="1.5" fill="none">
    <line x1="290" y1="220" x2="340" y2="220"/>
    <line x1="290" y1="375" x2="340" y2="375"/>
    <line x1="640" y1="375" x2="690" y2="375"/>
    <line x1="640" y1="130" x2="690" y2="130"/>
    <line x1="490" y1="470" x2="490" y2="495"/>
  </g>

  <text x="480" y="545" text-anchor="middle" font-size="10.5" fill="#67707f" font-family="monospace">Fig. 1 — Vue d'ensemble du système « Service IA » développé pendant le stage</text>
</svg>
